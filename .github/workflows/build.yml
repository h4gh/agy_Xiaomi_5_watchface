name: Build Minimal LCD Watch Face

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate watchface.xml with Google WFF Validator
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google/watchface.git /tmp/wff
          git -C /tmp/wff sparse-checkout set third_party/wff
          (cd /tmp/wff/third_party/wff && ./gradlew :specification:validator:executable-jar --no-daemon)
          java -jar /tmp/wff/third_party/wff/specification/validator/build/libs/wff-validator.jar 2 watchface/src/main/res/raw/watchface.xml

      - name: Build Watch Face APK
        run: gradle :watchface:assembleDebug --no-daemon

      - name: Upload Watch Face APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLCD-watchface-debug
          path: watchface/build/outputs/apk/debug/watchface-debug.apk
          if-no-files-found: error
